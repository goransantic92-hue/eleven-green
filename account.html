<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Your account — Eleven Green</title>
  <meta name="description" content="Demo customer account for the Eleven Green concept: profile, favourite branch and order history, stored only in your browser." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="wrap">
        <p class="eyebrow"><span class="dot"></span><span id="acctKicker">Your account</span></p>
        <h1 id="acctTitle">Welcome, <em>Elevener.</em></h1>
        <p class="lede" id="acctLede">Create an account to keep your orders, your favourite branch and a quicker way to order again.</p>
      </div>
    </section>
    <section class="section" style="padding-top:10px">
      <div class="wrap">
        <p class="demo-note" role="note">
          <strong>Demo account.</strong> It is stored only in this browser, uses no password and sends nothing to
          Eleven Green or anyone else. Clearing your browser data removes it.
        </p>
        <div id="acctRoot"></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/account.js"></script>
  <script src="js/site.js"></script>
  <script src="js/account-page.js"></script>
</body>
</html>
