<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Menu — Eleven Green</title>
  <meta name="description" content="The Eleven Green menu: specials, classics, limited drops, sides, extras, sweet stuff and drinks. Prices in AED." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />

<body>
  <header id="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="wrap">
        <p class="eyebrow"><span class="dot"></span>Menu · prices in AED</p>
        <h1>Simple <em>is</em> king.</h1>
        <p class="lede">Wagyu ground fresh every morning, cheese that melts, just enough sauce and onions always. Pick a branch to pre-order for pick-up.</p>
        <div class="actions-row">
          <a class="btn btn-yellow" href="https://www.eleven-green.com/order" target="_blank" rel="noopener">Pre-order now</a>
          <a class="btn btn-ghost" href="index.html">Build your own</a>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:20px">
      <div class="wrap">
        <nav class="chips" aria-label="Menu categories" data-render="menuTabs"></nav>
        <div class="menu-grid" data-render="menu"></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/site.js"></script>
